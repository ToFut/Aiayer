[loggers]
keys=root,sensors,llm,agent,ui,memory,websocket,bridge,neural_ui,do_button,overlay,backend,ui_detection

[handlers]
keys=consoleHandler,errorFileHandler,criticalFileHandler,infoFileHandler,debugFileHandler

[formatters]
keys=simpleFormatter,detailedFormatter

[logger_root]
level=WARNING
handlers=consoleHandler,errorFileHandler
propagate=0

[logger_sensors]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=sensors
propagate=0

[logger_llm]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=llm
propagate=0

[logger_agent]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=agent
propagate=0

[logger_ui]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=ui
propagate=0

[logger_memory]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=memory
propagate=0

[logger_websocket]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=websocket
propagate=0

[logger_bridge]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=bridge
propagate=0

[logger_neural_ui]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=neural_ui
propagate=0

[logger_do_button]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=do_button
propagate=0

[logger_overlay]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=overlay
propagate=0

[logger_backend]
level=WARNING
handlers=consoleHandler,errorFileHandler
qualname=backend
propagate=0

[logger_ui_detection]
level=INFO
handlers=consoleHandler,infoFileHandler
qualname=ui_detection
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=simpleFormatter
args=(sys.stdout,)

[handler_errorFileHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailedFormatter
args=('logs/error.log', 'a', 5242880, 3)

[handler_criticalFileHandler]
class=handlers.RotatingFileHandler
level=CRITICAL
formatter=detailedFormatter
args=('logs/critical.log', 'a', 5242880, 3)

[handler_infoFileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('logs/info.log', 'a', 5242880, 3)

[handler_debugFileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('logs/debug.log', 'a', 5242880, 3)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S