[loggers]
keys=root,sensors,llm,agent,ui

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter,detailedFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_sensors]
level=INFO
handlers=consoleHandler,fileHandler
qualname=sensors
propagate=0

[logger_llm]
level=INFO
handlers=consoleHandler,fileHandler
qualname=llm
propagate=0

[logger_agent]
level=INFO
handlers=consoleHandler,fileHandler
qualname=agent
propagate=0

[logger_ui]
level=INFO
handlers=consoleHandler,fileHandler
qualname=ui
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('local_assistant.log', 'a', 10485760, 3)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S