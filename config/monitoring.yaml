# Production Monitoring Configuration

# Logging Configuration
logging:
  level: INFO
  file: /var/log/aiayer/aiayer.log
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance Monitoring
performance:
  metrics_interval: 60  # seconds
  cpu_threshold: 80  # percentage
  memory_threshold: 85  # percentage
  response_time_threshold: 5  # seconds

# Health Checks
health:
  check_interval: 30  # seconds
  components:
    - name: "llm"
      timeout: 10
    - name: "sensors"
      timeout: 5
    - name: "memory"
      timeout: 2
    - name: "context_analyzer"
      timeout: 15

# Alerting
alerts:
  enabled: true
  email:
    smtp_server: "smtp.example.com"
    smtp_port: 587
    sender: "alerts@aiayer.com"
    recipients:
      - "admin@example.com"
  slack:
    webhook_url: "https://hooks.slack.com/services/..."
    channel: "#aiayer-alerts"

# Metrics Storage
metrics:
  type: "prometheus"  # or "influxdb"
  prometheus:
    port: 9090
    path: "/metrics"
  influxdb:
    host: "localhost"
    port: 8086
    database: "aiayer"
    username: "metrics"
    password: "password"

# Resource Limits
resources:
  max_memory: "4G"
  max_cpu: "2"
  max_concurrent_requests: 100
  max_queue_size: 1000 