# Local AI Assistant Configuration

# System settings
system:
  name: "Local AI Assistant"
  version: "0.1.0"
  debug: false

# Agent settings
agent:
  filter_patterns:
    - "password"
    - "secret"
    - "key"
    - "token"
    - "api_key"
    - "private_key"
    - "ssh_key"
    - "credential"
    - "authentication"
    - "authorization"

# Sensor settings
sensors:
  # Screen sensor
  screen:
    enabled: true
    interval_sec: 5
    capture_active_window_only: false  # If true, only captures the active window instead of full screen
    ocr_language: "eng"  # Tesseract language config (can be multiple, e.g., "eng+fra")
    max_text_length: 5000  # Maximum characters to keep from screen text

  # File system sensor
  file:
    enabled: true
    # Paths to monitor (will be expanded for ~ to user home)
    paths:
      - "~/Documents"
      - "~/Desktop"
      - "~/Downloads"
    ignore_patterns:
      - "*.tmp"
      - "~*"
      - ".DS_Store"
      - "Thumbs.db"
      - ".git/*"
      - "__pycache__/*"
      - "node_modules/*"
    max_events: 100  # Maximum number of recent events to store

  # Process sensor
  process:
    enabled: true
    interval_sec: 3
    track_all_processes: false  # If false, only track GUI applications

  # Browser sensor (optional)
  browser:
    enabled: false
    polling_interval_sec: 10  # How often to poll browser info (only used if enabled)
    browsers:
      - "Chrome"
      - "Safari"
      - "Firefox"

# LLM settings
llm:
  model_name: "mistral:latest"
  host: "localhost"
  port: 11434

# Memory settings
memory:
  max_conversation_length: 50

# LLM settings
llm:
  model_name: mistral
  host: localhost
  port: 11434  # Default Ollama port
  request_timeout_sec: 60
  temperature: 0.7
  max_tokens: 1000  # Max output tokens
  top_p: 0.95
  frequency_penalty: 0.0
  presence_penalty: 0.0
  retry_attempts: 2

# Memory settings
memory:
  max_conversation_length: 1  # Only keep the last message
  max_token_budget: 100  # Minimal token budget
  store_timestamps: false  # Don't store timestamps to save memory

# Security settings
security:
  sensitivity_patterns_path: "config/sensitivity_patterns.txt"
  allow_read_file_content: true  # If true, allows reading file content on explicit user request
  allow_network_access: false  # If true, allows the assistant to access internet (FUTURE)
  sanitize_sensitive_data: true  # If true, sanitizes sensitive data from responses
  bind_to_localhost: true  # If true, binds the web UI only to localhost

# UI settings
ui:
  host: "127.0.0.1"  # Change to 0.0.0.0 to allow access from other devices (not recommended)
  port: 5002
  title: "Local AI Assistant"
  theme: "auto"  # auto (system preference), light, dark
  enable_markdown: true

# Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "local_assistant.log"
  max_size_mb: 10
  backup_count: 3
  log_to_console: true