<\!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        h1, h2 {
            color: #333;
            text-align: center;
        }
        
        .status {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
            font-family: monospace;
            white-space: pre-wrap;
        }
        
        button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Debug Tool</h1>
        
        <div>
            <label for="wsUrl">WebSocket URL:</label>
            <input type="text" id="wsUrl" value="ws://localhost:8765" />
            <button onclick="connectWs()">Connect</button>
        </div>
        
        <div class="status" id="wsDebugStatus">Not connected</div>
        
        <div>
            <button onclick="sendTestMessage(window.debugWs)">Send Test Message</button>
            <button onclick="checkPorts()">Check Ports</button>
        </div>
        
        <h2>Last Message Received:</h2>
        <div class="status" id="wsDebugLastMessage">No messages yet</div>
        
        <h2>Port Check Results:</h2>
        <div class="status" id="portCheckResults">Not checked yet</div>
    </div>
    
    <script src="debug_websocket.js"></script>
    <script>
        function connectWs() {
            const url = document.getElementById('wsUrl').value;
            window.debugWs = debugWebSocket(url);
        }
        
        function checkPorts() {
            const portsToCheck = [8765, 8766, 8767, 8768];
            const results = document.getElementById('portCheckResults');
            results.innerHTML = "Checking ports...<br>";
            
            portsToCheck.forEach(port => {
                const testWs = new WebSocket(`ws://localhost:${port}`);
                
                testWs.onopen = function() {
                    results.innerHTML += `✅ Port ${port} is OPEN and accepting WebSocket connections<br>`;
                    testWs.close();
                };
                
                testWs.onerror = function() {
                    results.innerHTML += `❌ Port ${port} is closed or not accepting WebSocket connections<br>`;
                };
            });
        }
        
        // Connect automatically on page load
        window.onload = function() {
            connectWs();
        };
    </script>
</body>
</html>
