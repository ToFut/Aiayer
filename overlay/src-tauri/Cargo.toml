[package]
name = "ai-assistant-overlay"
version = "0.1.0"
description = "AI Assistant Overlay Application"
authors = ["AI Assistant Team"]
license = "MIT"
repository = ""
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "http-all", "macos-private-api", "window-all",
    "shell-open"] }
window-vibrancy = "0.3.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"] 
