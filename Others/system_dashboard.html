<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensAI System Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-healthy {
            background-color: #4CAF50;
        }

        .status-warning {
            background-color: #FF9800;
        }

        .status-error {
            background-color: #F44336;
        }

        .status-unknown {
            background-color: #9E9E9E;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .metric-item:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-weight: 500;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .log-viewer {
            background: rgba(0, 0, 0, 0.8);
            color: #00FF00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .health-summary {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .health-score {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .component-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .component-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 50px 0;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🧠 SensAI System Dashboard</h1>
            <p>Real-time monitoring of all system components</p>
        </div>

        <div class="health-summary" id="healthSummary">
            <div class="loading">
                <div class="spinner"></div>
                Loading system status...
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshStatus()">🔄 Refresh Status</button>
            <button class="btn btn-secondary" onclick="runIntegrationTest()">🧪 Run Tests</button>
            <button class="btn btn-secondary" onclick="toggleLogs()">📄 View Logs</button>
            <a href="futuristic_overlay.html" class="btn btn-secondary">💬 Open Chat</a>
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be populated by JavaScript -->
        </div>

        <div class="log-viewer" id="logViewer" style="display: none;">
            <div>System logs will appear here...</div>
        </div>
    </div>

    <script>
        let systemData = null;
        let refreshInterval = null;

        // WebSocket connection for real-time updates
        let ws = null;

        async function initializeWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:8765');
                
                ws.onopen = function() {
                    console.log('Dashboard WebSocket connected');
                    ws.send(JSON.stringify({
                        type: 'register',
                        client_type: 'dashboard',
                        payload: { timestamp: new Date().toISOString() }
                    }));
                };

                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.type === 'status_update') {
                        updateDashboard(data.data);
                    }
                };

                ws.onclose = function() {
                    console.log('Dashboard WebSocket disconnected');
                    setTimeout(initializeWebSocket, 5000);
                };

                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                };

            } catch (error) {
                console.error('Failed to initialize WebSocket:', error);
            }
        }

        async function getSystemStatus() {
            try {
                // Run health monitor script
                const response = await fetch('/api/health', { method: 'GET' });
                if (response.ok) {
                    return await response.json();
                }
                
                // Fallback: simulate status for demo
                return generateMockStatus();
                
            } catch (error) {
                console.error('Error fetching system status:', error);
                return generateMockStatus();
            }
        }

        function generateMockStatus() {
            return {
                timestamp: new Date().toISOString(),
                components: {
                    websocket_server: { status: 'healthy', port: 8765 },
                    backend_server: { status: 'healthy', port: 8767 },
                    llm_service: { status: 'healthy', port: 8766 },
                    overlay_server: { status: 'healthy', port: 8080 }
                },
                sensors: {
                    process_sensor: { status: 'running' },
                    screen_sensor: { status: 'running' },
                    memory_system: { status: 'running' }
                },
                system_metrics: {
                    cpu_percent: Math.random() * 50 + 10,
                    memory_percent: Math.random() * 60 + 20,
                    disk_usage: Math.random() * 40 + 30,
                    uptime_hours: 24.5,
                    component_count: 7,
                    healthy_components: 6,
                    health_ratio: 85.7
                },
                overall_health: 'good'
            };
        }

        function updateHealthSummary(data) {
            const healthSummary = document.getElementById('healthSummary');
            const metrics = data.system_metrics || {};
            const healthScore = Math.round(metrics.health_ratio || 0);
            
            let healthColor = '#4CAF50';
            let healthText = 'Excellent';
            
            if (healthScore < 50) {
                healthColor = '#F44336';
                healthText = 'Poor';
            } else if (healthScore < 70) {
                healthColor = '#FF9800';
                healthText = 'Fair';
            } else if (healthScore < 90) {
                healthColor = '#2196F3';
                healthText = 'Good';
            }

            healthSummary.innerHTML = `
                <div class="health-score" style="color: ${healthColor}">${healthScore}%</div>
                <div style="font-size: 1.2em; margin-bottom: 10px;">System Health: ${healthText}</div>
                <div>Last Updated: ${new Date(data.timestamp).toLocaleTimeString()}</div>
                <div class="component-list">
                    ${Object.entries(data.components || {}).map(([name, config]) => `
                        <div class="component-item">
                            <div class="status-indicator status-${config.status === 'healthy' ? 'healthy' : 'error'}"></div>
                            <span>${name.replace('_', ' ').toUpperCase()}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function createStatusCard(title, data, type = 'service') {
            const isHealthy = data.status === 'healthy' || data.status === 'running';
            const statusClass = isHealthy ? 'status-healthy' : 'status-error';
            
            let content = '';
            
            if (type === 'service') {
                content = `
                    <div class="metric-item">
                        <span class="metric-label">Port</span>
                        <span class="metric-value">${data.port}</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Status</span>
                        <span class="metric-value">${data.status}</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Last Check</span>
                        <span class="metric-value">${data.last_check ? new Date(data.last_check * 1000).toLocaleTimeString() : 'Never'}</span>
                    </div>
                `;
            } else if (type === 'sensor') {
                content = `
                    <div class="metric-item">
                        <span class="metric-label">Status</span>
                        <span class="metric-value">${data.status}</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Process Count</span>
                        <span class="metric-value">${data.last_result?.count || 'Unknown'}</span>
                    </div>
                `;
            } else if (type === 'metrics') {
                content = `
                    <div class="metric-item">
                        <span class="metric-label">CPU Usage</span>
                        <span class="metric-value">${data.cpu_percent?.toFixed(1) || 0}%</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Memory Usage</span>
                        <span class="metric-value">${data.memory_percent?.toFixed(1) || 0}%</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Disk Usage</span>
                        <span class="metric-value">${data.disk_usage?.toFixed(1) || 0}%</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Uptime</span>
                        <span class="metric-value">${data.uptime_hours?.toFixed(1) || 0}h</span>
                    </div>
                `;
            }

            return `
                <div class="status-card">
                    <div class="card-header">
                        <h3 class="card-title">${title}</h3>
                        <div class="status-indicator ${statusClass}"></div>
                    </div>
                    ${content}
                </div>
            `;
        }

        function updateDashboard(data) {
            systemData = data;
            
            // Update health summary
            updateHealthSummary(data);
            
            // Update status grid
            const statusGrid = document.getElementById('statusGrid');
            let cards = '';
            
            // Service components
            Object.entries(data.components || {}).forEach(([name, config]) => {
                cards += createStatusCard(
                    name.replace('_', ' ').toUpperCase(),
                    config,
                    'service'
                );
            });
            
            // Sensor components
            Object.entries(data.sensors || {}).forEach(([name, config]) => {
                cards += createStatusCard(
                    name.replace('_', ' ').toUpperCase(),
                    config,
                    'sensor'
                );
            });
            
            // System metrics
            if (data.system_metrics) {
                cards += createStatusCard(
                    'SYSTEM METRICS',
                    data.system_metrics,
                    'metrics'
                );
            }
            
            statusGrid.innerHTML = cards;
        }

        async function refreshStatus() {
            const data = await getSystemStatus();
            updateDashboard(data);
        }

        async function runIntegrationTest() {
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '🧪 Running Tests...';
            button.disabled = true;
            
            try {
                // In a real implementation, this would call the integration test script
                await new Promise(resolve => setTimeout(resolve, 3000));
                alert('Integration tests completed! Check logs for details.');
            } catch (error) {
                alert('Integration test failed: ' + error.message);
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        function toggleLogs() {
            const logViewer = document.getElementById('logViewer');
            const button = event.target;
            
            if (logViewer.style.display === 'none') {
                logViewer.style.display = 'block';
                button.textContent = '📄 Hide Logs';
                loadLogs();
            } else {
                logViewer.style.display = 'none';
                button.textContent = '📄 View Logs';
            }
        }

        function loadLogs() {
            const logViewer = document.getElementById('logViewer');
            const logs = [
                `[${new Date().toISOString()}] System startup completed`,
                `[${new Date().toISOString()}] WebSocket server listening on port 8765`,
                `[${new Date().toISOString()}] Backend server started on port 8767`,
                `[${new Date().toISOString()}] LLM service initialized`,
                `[${new Date().toISOString()}] Memory system active`,
                `[${new Date().toISOString()}] Screen sensor capturing`,
                `[${new Date().toISOString()}] Process sensor monitoring`,
                `[${new Date().toISOString()}] Brain router handlers registered`,
                `[${new Date().toISOString()}] All components healthy`
            ];
            
            logViewer.innerHTML = logs.join('\n');
            logViewer.scrollTop = logViewer.scrollHeight;
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            refreshStatus();
            initializeWebSocket();
            
            // Set up auto-refresh
            refreshInterval = setInterval(refreshStatus, 30000); // Refresh every 30 seconds
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
