<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard API Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
        button { padding: 8px 12px; margin: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard API Debug</h1>
        
        <div>
            <h2>Time Series API</h2>
            <button id="testTimeSeriesBtn">Test Time Series API</button>
            <div id="timeSeriesStatus"></div>
            <pre id="timeSeriesResult"></pre>
        </div>
        
        <div>
            <h2>Metrics API</h2>
            <button id="testMetricsBtn">Test Metrics API</button>
            <div id="metricsStatus"></div>
            <pre id="metricsResult"></pre>
        </div>
        
        <div>
            <h2>Chart Test</h2>
            <button id="testChartBtn">Test Chart Rendering</button>
            <div id="chartStatus"></div>
            <div style="height: 300px; width: 100%;">
                <canvas id="testChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // Time Series API Test
        document.getElementById('testTimeSeriesBtn').addEventListener('click', function() {
            const statusEl = document.getElementById('timeSeriesStatus');
            const resultEl = document.getElementById('timeSeriesResult');
            
            statusEl.innerHTML = 'Testing...';
            statusEl.className = '';
            
            fetch('http://localhost:8081/api/time-series')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    statusEl.innerHTML = 'Success!';
                    statusEl.className = 'success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                    
                    // Log data structure
                    console.log('Time Series Data:', data);
                    
                    // Check data validation
                    validateTimeSeriesData(data);
                })
                .catch(error => {
                    statusEl.innerHTML = `Error: ${error.message}`;
                    statusEl.className = 'error';
                    resultEl.textContent = error.stack;
                    console.error('Time Series API Error:', error);
                });
        });
        
        // Metrics API Test
        document.getElementById('testMetricsBtn').addEventListener('click', function() {
            const statusEl = document.getElementById('metricsStatus');
            const resultEl = document.getElementById('metricsResult');
            
            statusEl.innerHTML = 'Testing...';
            statusEl.className = '';
            
            fetch('http://localhost:8081/api/metrics')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    statusEl.innerHTML = 'Success!';
                    statusEl.className = 'success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                    
                    // Log data structure
                    console.log('Metrics Data:', data);
                })
                .catch(error => {
                    statusEl.innerHTML = `Error: ${error.message}`;
                    statusEl.className = 'error';
                    resultEl.textContent = error.stack;
                    console.error('Metrics API Error:', error);
                });
        });
        
        // Chart Test
        let testChart = null;
        document.getElementById('testChartBtn').addEventListener('click', function() {
            const statusEl = document.getElementById('chartStatus');
            const chartEl = document.getElementById('testChart');
            
            statusEl.innerHTML = 'Testing chart rendering with sample data...';
            statusEl.className = '';
            
            fetch('http://localhost:8081/api/time-series')
                .then(response => response.json())
                .then(data => {
                    try {
                        // Log data for chart
                        console.log('Chart Data:', data);
                        
                        // Create test chart with time series data
                        if (testChart) {
                            testChart.destroy();
                        }
                        
                        // Check if we have at least two data points, if not, generate fake ones
                        if (!data.timestamps || data.timestamps.length < 2) {
                            console.warn('Not enough data points for chart, generating fake ones');
                            const now = Math.floor(Date.now() / 1000);
                            data = {
                                timestamps: [now - 3600, now - 2400, now - 1200, now],
                                active_tasks: [1, 2, 3, 2],
                                memory_usage: [1024, 2048, 3072, 4096],
                                value_generated: [10, 20, 30, 40]
                            };
                        }
                        
                        // Convert timestamps to formatted dates
                        const labels = data.timestamps.map(ts => {
                            const date = new Date(ts * 1000);
                            return date.toLocaleTimeString();
                        });
                        
                        // Create chart
                        testChart = new Chart(chartEl, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Active Tasks',
                                    data: data.active_tasks,
                                    fill: false,
                                    borderColor: '#fd7e14',
                                    tension: 0.1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false
                            }
                        });
                        
                        statusEl.innerHTML = 'Chart rendered successfully!';
                        statusEl.className = 'success';
                    } catch (error) {
                        statusEl.innerHTML = `Chart rendering error: ${error.message}`;
                        statusEl.className = 'error';
                        console.error('Chart Rendering Error:', error);
                    }
                })
                .catch(error => {
                    statusEl.innerHTML = `Error: ${error.message}`;
                    statusEl.className = 'error';
                    console.error('Chart Test Error:', error);
                });
        });
        
        // Validate time series data
        function validateTimeSeriesData(data) {
            console.log('Validating time series data...');
            
            // Check if data exists
            if (!data) {
                console.error('Data is null or undefined');
                return false;
            }
            
            // Check if data has required properties
            if (!data.timestamps || !data.active_tasks || !data.memory_usage || !data.value_generated) {
                console.error('Missing required properties in data');
                return false;
            }
            
            // Check if arrays have same length
            const timestampsLength = data.timestamps.length;
            if (data.active_tasks.length !== timestampsLength || 
                data.memory_usage.length !== timestampsLength || 
                data.value_generated.length !== timestampsLength) {
                console.error('Arrays have different lengths');
                return false;
            }
            
            // Check if there are enough data points for a chart (at least 2)
            if (timestampsLength < 2) {
                console.warn('Not enough data points for a meaningful chart (need at least 2)');
            }
            
            // Check if all values are zero
            const allZeros = data.active_tasks.every(v => v === 0) && 
                            data.memory_usage.every(v => v === 0) && 
                            data.value_generated.every(v => v === 0);
            
            if (allZeros) {
                console.warn('All data values are zero, chart may not be visually useful');
            }
            
            console.log('Validation complete');
            return true;
        }
    </script>
</body>
</html>
