<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test DO Button</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .button-panel {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }
        
        .do-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .do-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .dismiss-btn {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .dismiss-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }
        
        .status {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DO Button Test</h1>
        
        <div class="status" id="connectionStatus">Connecting to WebSocket server...</div>
        
        <div class="button-panel">
            <button class="do-btn" id="doButton">🟢 DO</button>
            <button class="dismiss-btn" id="dismissButton">🔴 DISMISS</button>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0% - Initializing...</div>
        </div>
        
        <div class="status" id="messageLog"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const connectionStatus = document.getElementById('connectionStatus');
            const messageLog = document.getElementById('messageLog');
            const doButton = document.getElementById('doButton');
            const dismissButton = document.getElementById('dismissButton');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            let ws = null;
            
            // Connect to WebSocket server
            function connect() {
                connectionStatus.textContent = 'Connecting to WebSocket server...';
                
                ws = new WebSocket('ws://localhost:8765');
                
                ws.onopen = function() {
                    connectionStatus.textContent = '✅ Connected to WebSocket server';
                    addToLog('Connected to WebSocket server');
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    addToLog('Received: ' + JSON.stringify(data, null, 2));
                    
                    // Handle progress updates
                    if (data.type === 'agent_progress') {
                        progressContainer.style.display = 'block';
                        progressFill.style.width = data.progress + '%';
                        progressText.textContent = data.progress + '% - ' + data.message;
                    }
                    
                    // Handle execution success
                    if (data.type === 'agent_execution_success') {
                        // Complete the progress bar
                        progressFill.style.width = '100%';
                        progressText.textContent = '100% - ' + data.summary;
                        
                        // Show success message
                        connectionStatus.textContent = '✅ Execution completed successfully!';
                        connectionStatus.style.borderLeftColor = '#4CAF50';
                    }
                    
                    // Handle errors
                    if (data.type === 'error') {
                        connectionStatus.textContent = '❌ Error: ' + data.error;
                        connectionStatus.style.borderLeftColor = '#f44336';
                    }
                };
                
                ws.onclose = function() {
                    connectionStatus.textContent = '❌ Disconnected from WebSocket server';
                    connectionStatus.style.borderLeftColor = '#f44336';
                    addToLog('Disconnected from WebSocket server');
                    
                    // Try to reconnect after 3 seconds
                    setTimeout(connect, 3000);
                };
                
                ws.onerror = function(error) {
                    connectionStatus.textContent = '❌ WebSocket error';
                    connectionStatus.style.borderLeftColor = '#f44336';
                    addToLog('WebSocket error: ' + error);
                };
            }
            
            // Add message to log
            function addToLog(message) {
                const now = new Date().toLocaleTimeString();
                messageLog.textContent = `[${now}] ${message}\n${messageLog.textContent}`;
            }
            
            // Send agent confirmation (DO button)
            doButton.addEventListener('click', function() {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectionStatus.textContent = '❌ Not connected to WebSocket server';
                    return;
                }
                
                // Reset progress
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
                
                // Send button_action message directly
                const buttonMessage = {
                    type: 'button_action',
                    action: 'EXECUTE_PLAN',
                    plan_id: 'test_plan_' + Date.now(),
                    actions: [
                        {
                            "type": "click",
                            "x": 500,
                            "y": 500,
                            "description": "Click at center of screen"
                        }
                    ],
                    timestamp: new Date().toISOString()
                };
                
                ws.send(JSON.stringify(buttonMessage));
            });
            
            // Send dismiss action
            dismissButton.addEventListener('click', function() {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectionStatus.textContent = '❌ Not connected to WebSocket server';
                    return;
                }
                
                // Create confirmation message
                const message = {
                    type: 'agent_confirmation',
                    session_id: sessionId,
                    action: 'DISMISS',
                    modifications: {},
                    timestamp: new Date().toISOString()
                };
                
                // Send message
                ws.send(JSON.stringify(message));
                addToLog('Sent DISMISS confirmation: ' + JSON.stringify(message, null, 2));
                
                // Hide progress
                progressContainer.style.display = 'none';
                
                connectionStatus.textContent = '❌ Plan dismissed';
                connectionStatus.style.borderLeftColor = '#f44336';
            });
            
            // Start connection
            connect();
        });
    </script>
</body>
</html>
