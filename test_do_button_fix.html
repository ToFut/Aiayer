<\!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO Button Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .do-btn {
            background-color: #4CAF50;
            color: white;
        }
        .dismiss-btn {
            background-color: #f44336;
            color: white;
        }
        pre {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        .progress-bar {
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
            width: 0%;
            transition: width 0.5s ease;
        }
        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DO Button Test</h1>
        
        <div class="status" id="connectionStatus">Connecting to WebSocket server...</div>
        
        <div>
            <h3>WebSocket URL:</h3>
            <input type="text" id="wsUrl" value="ws://localhost:8765" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            <button onclick="connectWs()">Connect</button>
        </div>
        
        <div style="margin-top: 20px;">
            <h3>Action Types:</h3>
            <button class="do-btn" onclick="sendDoButton()">DO Button</button>
            <button class="do-btn" onclick="sendButtonAction()">button_action</button>
            <button class="do-btn" onclick="sendAgentConfirmation()">agent_confirmation</button>
            <button class="dismiss-btn" onclick="sendDismiss()">DISMISS</button>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0% - Initializing...</div>
        </div>
        
        <h3>Message Log:</h3>
        <pre id="messageLog"></pre>
        
        <h3>Response:</h3>
        <pre id="responseLog"></pre>
    </div>
    
    <script>
        let ws = null;
        let connectCount = 0;
        const messageLog = document.getElementById('messageLog');
        const responseLog = document.getElementById('responseLog');
        const connectionStatus = document.getElementById('connectionStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        
        function connectWs() {
            const url = document.getElementById('wsUrl').value;
            
            // Close existing connection
            if (ws) {
                ws.close();
            }
            
            // Update status
            connectionStatus.textContent = `Connecting to ${url}...`;
            connectionStatus.style.backgroundColor = '#fff3cd';
            connectionStatus.style.border = '1px solid #ffeeba';
            
            try {
                connectCount++;
                logMessage(`Connection attempt #${connectCount} to ${url}`);
                
                // Create new WebSocket connection
                ws = new WebSocket(url);
                
                ws.onopen = function() {
                    connectionStatus.textContent = `✅ Connected to ${url}`;
                    connectionStatus.style.backgroundColor = '#d4edda';
                    connectionStatus.style.border = '1px solid #c3e6cb';
                    logMessage(`WebSocket connection established to ${url}`);
                };
                
                ws.onclose = function(event) {
                    connectionStatus.textContent = `❌ Disconnected (Code: ${event.code})`;
                    connectionStatus.style.backgroundColor = '#f8d7da';
                    connectionStatus.style.border = '1px solid #f5c6cb';
                    logMessage(`WebSocket connection closed: Code ${event.code}, Reason: ${event.reason || 'No reason provided'}`);
                };
                
                ws.onerror = function(error) {
                    connectionStatus.textContent = '❌ Connection error';
                    connectionStatus.style.backgroundColor = '#f8d7da';
                    connectionStatus.style.border = '1px solid #f5c6cb';
                    logMessage(`WebSocket error occurred`);
                    console.error("WebSocket error:", error);
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        logResponse(data);
                        
                        // Handle progress updates
                        if (data.type === 'agent_progress') {
                            progressContainer.style.display = 'block';
                            progressFill.style.width = data.progress + '%';
                            progressText.textContent = data.progress + '% - ' + data.message;
                        }
                        
                        // Handle execution success
                        if (data.type === 'agent_execution_success') {
                            // Complete the progress bar
                            progressFill.style.width = '100%';
                            progressText.textContent = '100% - ' + data.summary;
                        }
                        
                    } catch (e) {
                        logResponse({
                            error: "Failed to parse response",
                            raw: event.data
                        });
                    }
                };
            } catch (error) {
                connectionStatus.textContent = '❌ Failed to create WebSocket connection';
                connectionStatus.style.backgroundColor = '#f8d7da';
                connectionStatus.style.border = '1px solid #f5c6cb';
                logMessage(`Failed to create WebSocket: ${error.message}`);
                console.error("Failed to create WebSocket:", error);
            }
        }
        
        function logMessage(message) {
            const now = new Date().toLocaleTimeString();
            messageLog.textContent = `[${now}] ${message}\n${messageLog.textContent}`;
        }
        
        function logResponse(data) {
            const now = new Date().toLocaleTimeString();
            responseLog.textContent = `[${now}] ${JSON.stringify(data, null, 2)}\n\n${responseLog.textContent}`;
        }
        
        function sendDoButton() {
            if (\!ws || ws.readyState \!== WebSocket.OPEN) {
                alert("WebSocket is not connected\!");
                return;
            }
            
            const message = {
                type: "do_button",
                button: "DO",
                plan_id: "test_plan_" + Date.now(),
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            logMessage(`Sent DO button message: ${JSON.stringify(message)}`);
        }
        
        function sendButtonAction() {
            if (\!ws || ws.readyState \!== WebSocket.OPEN) {
                alert("WebSocket is not connected\!");
                return;
            }
            
            // Reset progress
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            
            const message = {
                type: "button_action",
                action: "EXECUTE_PLAN",
                plan_id: "test_plan_" + Date.now(),
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            logMessage(`Sent button_action message: ${JSON.stringify(message)}`);
        }
        
        function sendAgentConfirmation() {
            if (\!ws || ws.readyState \!== WebSocket.OPEN) {
                alert("WebSocket is not connected\!");
                return;
            }
            
            // Reset progress
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            
            const message = {
                type: "agent_confirmation",
                action: "DO",
                sessionId: "test_session_" + Date.now(),
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            logMessage(`Sent agent_confirmation message: ${JSON.stringify(message)}`);
        }
        
        function sendDismiss() {
            if (\!ws || ws.readyState \!== WebSocket.OPEN) {
                alert("WebSocket is not connected\!");
                return;
            }
            
            const message = {
                type: "button_action",
                action: "DISMISS",
                plan_id: "test_plan_" + Date.now(),
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            logMessage(`Sent DISMISS message: ${JSON.stringify(message)}`);
        }
        
        // Auto-connect on page load
        window.onload = function() {
            connectWs();
        };
    </script>
</body>
</html>
