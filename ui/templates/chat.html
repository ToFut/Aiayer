<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>
    <div class="assistant-widget">
        <div class="widget-header">
            <div class="widget-title">
                <span class="widget-icon">🤖</span>
                <span class="widget-name">Personal Assistant</span>
            </div>
            <div class="widget-controls">
                <button id="minimize-btn" class="control-btn">−</button>
                <button id="close-btn" class="control-btn">×</button>
        </div>
        </div>
        
        <div class="widget-content">
            <div id="chat-messages" class="chat-messages">
            {% for message in conversation %}
            <div class="message {{ message.role }}">
                    <div class="message-content">{{ message.content }}</div>
                </div>
                {% endfor %}
        </div>
        
            <div class="input-area">
                <input type="text" id="query-input" placeholder="Ask me anything..." autocomplete="off">
            <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
